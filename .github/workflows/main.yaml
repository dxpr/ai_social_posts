name: Main

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          helpURL: https://github.com/your-repo/ai_social_posts/blob/main/CONTRIBUTING.md

  drupal-lint:
    runs-on: ubicloud-standard-4
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Lint Drupal
      run: |
        docker compose run --rm drupal-lint

  php-lint:
    name: PHP Lint
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --no-progress

      - name: Run PHP CodeSniffer
        run: composer lint
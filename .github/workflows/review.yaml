name: Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubicloud-standard-4
    steps:
      - uses: ytanikin/pr-conventional-commits@1.4.0
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          custom_labels: '{"feat": "feature", "fix": "bug fix", "docs": "documentation", "test": "testing", "ci": "ci", "refactor": "refactor", "perf": "performance", "chore": "maintenance", "revert": "revert"}'
          add_label: 'true'
          add_scope_label: 'true'

  commitlint:
    name: Lint Commit Messages
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
          helpURL: https://github.com/your-repo/ai_social_posts/blob/main/CONTRIBUTING.md
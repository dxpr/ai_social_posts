ai_social_posts.ai_social_post_add:

  # The route which will be invoked when the link is clicked.
  route_name: ai_social_posts.ai_social_post_add
  title: 'Add social post'

  # The pages where the link appears, indicated by their route names.
  appears_on:
    - entity.ai_social_post.collection
    - entity.ai_social_post.canonical

ai_social_post_type_add:
  route_name: 'entity.ai_social_post_type.add_form'
  title: 'Add social post type'
  appears_on:
    - entity.ai_social_post_type.collection

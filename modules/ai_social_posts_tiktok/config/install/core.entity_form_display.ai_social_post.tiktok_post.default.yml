langcode: en
status: true
dependencies:
  config:
    - field.field.ai_social_post.tiktok_post.title
    - field.field.ai_social_post.tiktok_post.post
    - ai_social_posts.ai_social_post_type.tiktok_post
  module:
    - maxlength
    - text
id: ai_social_post.tiktok_post.default
targetEntityType: ai_social_post
bundle: tiktok_post
mode: default
content:
  title:
    type: text_textarea
    weight: 0
    region: content
    settings:
      rows: 4
      placeholder: 'Enter your TikTok caption'
    third_party_settings:
      maxlength:
        maxlength_js: 2200
        maxlength_js_enforce: false
  post:
    type: text_textarea
    weight: 1
    region: content
    settings:
      rows: 8
      placeholder: 'Write your TikTok script'
    third_party_settings:
      maxlength:
        maxlength_js: 1000
        maxlength_js_enforce: false
  node_id:
    type: entity_reference_autocomplete
    weight: 2
    region: content
    settings:
      match_operator: CONTAINS
      match_limit: 10
      size: 60
      placeholder: 'Search for content to promote'
    third_party_settings: {}
hidden: {} 
